<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>开发者项目管理工作台</title>
    <script>
      // 避免首屏主题闪烁
      (function () {
        try {
          var raw = localStorage.getItem('dwb.theme') || 'system';
          var isDark =
            raw === 'dark' ||
            (raw === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
