# electron-builder 打包配置
# 文档：https://www.electron.build/configuration/configuration
appId: com.devprojectworkbench.app
productName: DevProjectWorkbench
copyright: Copyright © 2026 Dev Project Workbench

directories:
  # 打包输出目录
  output: release
  # 应用根目录（构建上下文），electron/main.js 与 server/ 都在此
  buildResources: .

# 要打进 asar 的文件（入口 + 后端 + 已构建的前端 + 应用图标）
files:
  - electron/**/*
  - server/**/*
  - shared/**/*
  - dist/**/*
  - assets/**/*
  - package.json

# asar 内 server/ 需要被动态 import，保留即可（默认 asar 支持 ES module）
asar: true
# 把前端静态资源、后端代码与 shared/ 常量解包到 asar 外（resources/app.asar.unpacked/），
# 以真实文件系统存在，确保 Express 静态托管与 ESM 动态 import 稳定可靠。
# ⚠️ shared/ 必须解包：解包后的 server/index.js 以 ../shared/ports.js 相对路径引包，
# 若 shared/ 只留在 asar 内，打包版启动时会因找不到模块而直接崩溃。
asarUnpack:
  - dist/**
  - server/**
  - shared/**

# 额外不打包进 asar、但需随附的资源
extraResources: []

win:
  target:
    # NSIS 安装版（推荐分发）
    - target: nsis
      arch: x64
    # 单文件便携版（免安装，解压即用）
    - target: portable
      arch: x64
  # 应用图标（Windows 可执行文件/安装包图标）
  icon: assets/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: DevProjectWorkbench

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# 不打包 devDependencies 中的重型工具（vite/typescript 等），仅 runtime 依赖
npmRebuild: false

publish: null
